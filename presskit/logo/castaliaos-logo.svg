<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="badge" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2E5CC8"/>
      <stop offset="100%" stop-color="#102A74"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4DC8E"/>
      <stop offset="55%" stop-color="#D8A83C"/>
      <stop offset="100%" stop-color="#9A741C"/>
    </linearGradient>
  </defs>

  <!-- Crest badge -->
  <g transform="translate(20,30)">
    <rect x="0" y="0" width="200" height="200" rx="40" fill="url(#badge)"/>
    <rect x="3.5" y="3.5" width="193" height="193" rx="37" fill="none" stroke="#D8A83C" stroke-width="6"/>
    <!-- Castle (gold) -->
    <g fill="url(#gold)">
      <!-- side towers -->
      <rect x="24" y="66" width="28" height="86"/>
      <rect x="24" y="52" width="12" height="14"/><rect x="40" y="52" width="12" height="14"/>
      <rect x="148" y="66" width="28" height="86"/>
      <rect x="148" y="52" width="12" height="14"/><rect x="164" y="52" width="12" height="14"/>
      <!-- main wall -->
      <rect x="34" y="92" width="132" height="60"/>
      <rect x="34" y="82" width="18" height="10"/><rect x="70" y="82" width="18" height="10"/>
      <rect x="112" y="82" width="18" height="10"/><rect x="148" y="82" width="18" height="10"/>
      <!-- keep -->
      <rect x="76" y="44" width="48" height="108"/>
      <rect x="76" y="32" width="14" height="12"/><rect x="97" y="32" width="14" height="12"/>
      <rect x="118" y="32" width="6" height="12"/>
    </g>
    <!-- gate + window (navy) -->
    <path d="M92 152 v-24 a12 12 0 0 1 24 0 v24 z" fill="#0A1E4E"/>
    <rect x="97" y="58" width="14" height="22" rx="4" fill="#0A1E4E"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="140" font-size="104" font-weight="800" letter-spacing="-2">
    <tspan fill="#0A1E4E">Castalia</tspan><tspan fill="#D8A83C">OS</tspan>
  </text>
  <text x="812" y="112" font-size="42" font-weight="800" fill="#D8A83C">98 PE</text>
  <text x="260" y="188" font-size="30" font-weight="700" fill="#3A5492">Powerful Edition &#183; an original retro desktop OS</text>
</svg>
