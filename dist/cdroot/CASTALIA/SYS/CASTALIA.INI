; CastaliaOS 98 PE - main configuration
; This file is plain text and safe to edit from DOS with any editor.
; Delete it to restore defaults; the shell recreates missing keys.

[Shell]
Theme=Classic
Wallpaper=

[Assets]
; Desktop / toolbar / Quick Launch icon pack: a directory of keyed BMPs (see
; ICONS\README.TXT). Ships with two packs -- TANGO (the public-domain Tango
; set, default) and CASTALIA (the original MIT set). Clear this line to fall
; back to the built-in procedural icons.
Icons=C:\CASTALIA\ICONS\TANGO
; System text face: spleen (bundled BSD Spleen 5x8, default) or system (the
; original hand-authored 8x8). Same metrics either way.
Font=spleen

[Theme]
; Preset: 0=Classic 1=Storm 2=Forest 3=High Contrast
Preset=0
; Colors: 0=native/truecolor, 16=EGA-16 palette, 256=3-3-2 palette. A 16-color
; theme renders the desktop and window chrome in the classic 16-color look
; (flat background, EGA colors); icon-pack icons are mapped onto the same
; palette so the whole desktop reads as one coherent low-color set.
Colors=0

[Video]
; Preferred mode is 800x600x16; the shell falls back automatically
; (800x600x16 -> 640x480x16 -> 640x480x8) if a mode is unavailable.
Width=800
Height=600
Depth=16

[Boot]
; Set SafeMode=1 to force the high-contrast, minimal profile on next boot.
SafeMode=0

[Mouse]
Speed=5

[Sound]
; Sound is optional and never required to reach the desktop.
Enabled=0

[Paths]
Trash=C:\CASTALIA\TRASH
Logs=C:\CASTALIA\LOGS
